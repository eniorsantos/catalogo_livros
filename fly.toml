app = "troque-pelo-nome-do-app"
primary_region = "gru"

[build]

[env]
  PORT = "3000"
  DB_MODE = "local"           # SQLite no volume abaixo; mude p/ cloud ou hybrid + secret DATABASE_URL

[mounts]
  source = "data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
